# NuxDroid repository configuration
# Format: <name> <url> <dist> <comp> [key=<URL>|trusted]
# Lines starting with # are comments. Empty lines are ignored.
#
# Example (local testing):
# local http://127.0.0.1:8000 stable main trusted
#
# Example (remote, signed):
# nuxdroid https://nuxdroid.example.com/apt stable main key=https://nuxdroid.example.com/apt/key.gpg
