name: Build NuxDroid

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full:
        description: Build custom bootstrap and installable APK
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nuxdroid-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  TERMUX_PACKAGES_COMMIT: 824221abf741a02ac50dc8ce161b52604b3e1a58
  TERMUX_APP__PACKAGE_NAME: com.nuxdroid
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  # Fast feedback: compile the APK with the upstream bootstrap. This APK is
  # compile-smoke only and must not be installed because its bootstrap prefix
  # is still /data/data/com.termux.
  smoke-apk:
    name: Compile smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout NuxDroid
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Build smoke APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: nuxdroid-compile-smoke-do-not-install
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1

  bootstrap:
    name: Build custom bootstrap (com.nuxdroid)
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TERMUX_DOCKER_USE_SUDO: "1"
    steps:
      - name: Checkout NuxDroid
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/local/lib/node_modules \
            /usr/share/swift \
            /usr/lib/mono
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Checkout Termux packages
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: ${{ env.TERMUX_PACKAGES_COMMIT }}
          path: termux-packages
          fetch-depth: 1

      - name: Configure custom prefix
        working-directory: termux-packages
        run: |
          sed -i \
            "s/^TERMUX_APP__PACKAGE_NAME=\"com.termux\"/TERMUX_APP__PACKAGE_NAME=\"${TERMUX_APP__PACKAGE_NAME}\"/" \
            scripts/properties.sh
          grep -n '^TERMUX_APP__PACKAGE_NAME=' scripts/properties.sh
          grep -n '^TERMUX_APP__DATA_DIR=' scripts/properties.sh

          # The package-builder image exports the default com.termux paths in
          # its environment. The build scripts override them as shell
          # variables, but child configure scripts inherit the old exported
          # values unless the custom values are exported too. This caused
          # termux-tools to install scripts and preinst metadata with the
          # official com.termux prefix even though the files landed under the
          # custom com.nuxdroid prefix.
          cat >> scripts/properties.sh <<'EOF'

          # Export custom Termux paths for child build systems (configure, make, etc.).
          export TERMUX_APP__PACKAGE_NAME TERMUX_APP_PACKAGE TERMUX_APP__DATA_DIR
          export TERMUX__ROOTFS TERMUX_BASE_DIR
          export TERMUX__HOME TERMUX_ANDROID_HOME
          export TERMUX__PREFIX TERMUX_PREFIX
          export TERMUX__PREFIX_CLASSICAL TERMUX_PREFIX_CLASSICAL
          export TERMUX__CACHE_DIR TERMUX_CACHE_DIR
          export TERMUX_APPS_DIR
          export TERMUX_PACKAGE_FORMAT
          EOF

          # command-not-found pulls in nodejs/python/tk, which is far too heavy
          # for a minimal bootstrap and is not needed for the Phase 0 terminal.
          # Remove its whole conditional block; removing only the package line
          # would leave an empty "then" branch and a shell syntax error.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/build-bootstraps.sh')
          text = path.read_text()
          not_found_block = (
              '\t\tif ! ${BOOTSTRAP_ANDROID10_COMPATIBLE}; then\n'
              '\t\t\tPACKAGES+=("command-not-found")\n'
              '\t\telse\n'
              '\t\t\tPACKAGES+=("proot")\n'
              '\t\tfi\n'
          )
          if not_found_block not in text:
              raise SystemExit('command-not-found/proot block not found')
          text = text.replace(not_found_block, '')
          bzip2_entry = '\t\tPACKAGES+=("bzip2")\n'
          if bzip2_entry not in text:
              raise SystemExit('bzip2 package entry not found')
          text = text.replace(bzip2_entry, '\t\tPACKAGES+=("libbz2")\n')

          # build-bootstraps.sh uses TERMUX_BUILT_PACKAGES_DIRECTORY_FOR_ARCH
          # for the -f cleanup, but that variable does not exist in the
          # pinned tree. Without this fix, -f expands to /* and tries to
          # delete the container root. The built-package markers are stored
          # flat in TERMUX_BUILT_PACKAGES_DIRECTORY, so clear those instead.
          force_old = (
              '\t\tif [[ $FORCE_BUILD_PACKAGES == "1" ]]; then\n'
              '\t\t\trm -f "$TERMUX_BUILT_PACKAGES_DIRECTORY_FOR_ARCH"/*\n'
              '\t\t\trm -f "$TERMUX_BUILT_DEBS_DIRECTORY"/*\n'
              '\t\tfi'
          )
          force_new = (
              '\t\tif [[ $FORCE_BUILD_PACKAGES == "1" ]]; then\n'
              '\t\t\trm -f "${TERMUX_BUILT_PACKAGES_DIRECTORY:?}"/*\n'
              '\t\t\trm -f "$TERMUX_BUILT_DEBS_DIRECTORY"/*\n'
              '\t\tfi'
          )
          if force_old not in text:
              raise SystemExit('build-bootstraps.sh force cleanup block not found')
          text = text.replace(force_old, force_new)

          old = (
              '\t\tfor package_name in "${PACKAGES[@]}"; do\n'
              '\t\t\tset +e\n'
              '\t\t\tbuild_package "$TERMUX_ARCH" "$package_name" || return $?\n'
              '\t\t\tset -e\n'
              '\t\tdone'
          )
          new = (
              '\t\tfor package_name in "${PACKAGES[@]}"; do\n'
              '\t\t\tset +e\n'
              '\t\t\tbuild_package "$TERMUX_ARCH" "$package_name" || return $?\n'
              '\t\t\tset -e\n'
              '\t\t\trm -rf "$HOME/.termux-build"/*/build "$HOME/.termux-build"/*/src "$HOME/.termux-build"/*/massage "$HOME/.termux-build"/*/tmp 2>/dev/null || true\n'
              '\t\tdone'
          )
          if old not in text:
              raise SystemExit('build-bootstraps.sh loop pattern not found')
          text = text.replace(old, new)

          # Keep a copy of the bootstrap archive inside the container home.
          # The workspace is a bind mount owned by the runner user, while the
          # container may run as a different uid; if the final mv fails, the
          # archive would otherwise be deleted by the EXIT trap.
          archive_old = (
              ')\n'
              '\n'
              '\tmv -f "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" "$TERMUX_PACKAGES_DIRECTORY/"\n'
          )
          archive_new = (
              ')\n'
              '\n'
              '\tcp -f "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" "/home/builder/bootstrap-${1}.zip" || true\n'
              '\tmv -f "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" "$TERMUX_PACKAGES_DIRECTORY/"\n'
          )
          if archive_old not in text:
              raise SystemExit('create_bootstrap_archive mv block not found')
          path.write_text(text.replace(archive_old, archive_new))

          # The apt package writes the official Termux repository into the
          # custom prefix by default. Those binaries target com.termux and
          # must never be installed into the NuxDroid prefix.
          apt_path = Path('packages/apt/build.sh')
          apt_text = apt_path.read_text()
          apt_sources_old = (
              '\t{\n'
              '\t\techo "# The main termux repository, with cloudflare cache"\n'
              '\t\techo "deb https://packages-cf.termux.dev/apt/termux-main/ stable main"\n'
              '\t\techo "# The main termux repository, without cloudflare cache"\n'
              '\t\techo "# deb https://packages.termux.dev/apt/termux-main/ stable main"\n'
              '\t} > $TERMUX_PREFIX/etc/apt/sources.list'
          )
          apt_sources_new = (
              '\t{\n'
              '\t\techo "# NuxDroid: custom package repository (GitHub Pages)"\n'
              '\t\techo "deb [trusted=yes] https://mrzgamingv20-cyber.github.io/nuxdroid-packages aarch64 main"\n'
              '\t} > $TERMUX_PREFIX/etc/apt/sources.list'
          )
          if apt_sources_old not in apt_text:
              raise SystemExit('apt sources.list block not found')
          apt_path.write_text(apt_text.replace(apt_sources_old, apt_sources_new))

          # termux-tools assumes the Android applicationId and the Java
          # namespace are identical. NuxDroid keeps the Java classes under
          # com.termux but uses applicationId com.nuxdroid, so component
          # class names must stay com.termux.app.* while package names and
          # actions use com.nuxdroid. Patch the installed scripts before the
          # .deb is created.
          termux_tools_path = Path('packages/termux-tools/build.sh')
          termux_tools_text = termux_tools_path.read_text()
          post_install_old = (
              'termux_step_post_make_install() {\n'
              '\tTERMUX_PKG_CONFFILES="$(cat "$TERMUX_PKG_BUILDDIR/conffiles")"\n'
              '}\n'
          )
          post_install_new = (
              'termux_step_post_make_install() {\n'
              '\tTERMUX_PKG_CONFFILES="$(cat "$TERMUX_PKG_BUILDDIR/conffiles")"\n'
              '\n'
              '\t# Keep app component class names in the Termux Java namespace.\n'
              '\tlocal app_pkg="$TERMUX_APP_PACKAGE"\n'
              '\tlocal app_pkg_escaped="${app_pkg//./\\\\.}"\n'
              '\tlocal app_ns="${TERMUX_APP__NAMESPACE:-com.termux}"\n'
              '\tlocal script_path\n'
              '\tfor script_path in "$TERMUX_PREFIX"/bin/*; do\n'
              '\t\t[ -f "$script_path" ] || continue\n'
              '\t\tgrep -Iq . "$script_path" 2>/dev/null || continue\n'
              '\t\tif grep -q "${app_pkg}/${app_pkg}\\\\.app\\\\." "$script_path"; then\n'
              '\t\t\tsed -i "s#${app_pkg_escaped}/${app_pkg_escaped}\\\\.app\\\\.#${app_pkg}/${app_ns}.app.#g" "$script_path"\n'
              '\t\tfi\n'
              '\tdone\n'
              '}\n'
          )
          if post_install_old not in termux_tools_text:
              raise SystemExit('termux-tools post_make_install block not found')
          termux_tools_path.write_text(
              termux_tools_text.replace(post_install_old, post_install_new)
          )

          # termux-exec ships a shell helper whose comment contains the
          # upstream com.termux prefix. It is only a comment, but the bootstrap
          # isolation check intentionally rejects every textual reference to
          # the official prefix. Rewrite the installed helper after make install.
          termux_exec_path = Path('packages/termux-exec/build.sh')
          termux_exec_text = termux_exec_path.read_text()
          if 'termux_step_post_make_install()' in termux_exec_text:
              raise SystemExit('termux-exec already defines termux_step_post_make_install')
          termux_exec_post_install = (
              '\n'
              'termux_step_post_make_install() {\n'
              '\tlocal script_path="$TERMUX_PREFIX/bin/termux-exec-ld-preload-lib"\n'
              '\tif [ -f "$script_path" ]; then\n'
              '\t\tsed -i "s#/data/data/com.termux#${TERMUX_PREFIX}#g" "$script_path"\n'
              '\tfi\n'
              '}\n'
          )
          termux_exec_path.write_text(termux_exec_text + termux_exec_post_install)
          PY
          if grep -n 'command-not-found' scripts/build-bootstraps.sh; then
            echo 'command-not-found block was not fully removed' >&2
            exit 1
          fi
          grep -n 'PACKAGES+=("libbz2")' scripts/build-bootstraps.sh
          grep -n 'rm -rf "$HOME/.termux-build"' scripts/build-bootstraps.sh
          if grep -n 'packages-cf.termux.dev' packages/apt/build.sh; then
            echo 'official Termux apt repository is still configured' >&2
            exit 1
          fi

      - name: Prepare builder container
        working-directory: termux-packages
        run: |
          # run-docker.sh only creates the container on its first invocation.
          ./scripts/run-docker.sh true
          sudo docker exec termux-package-builder sh -c '
            set -e
            echo "container user: $(id)"
            ls -ldn /home/builder/termux-packages
            touch /home/builder/.nuxdroid-write-test
            rm -f /home/builder/.nuxdroid-write-test
            echo "container home write test: OK"
            if touch /home/builder/termux-packages/.nuxdroid-write-test; then
              rm -f /home/builder/termux-packages/.nuxdroid-write-test
              echo "workspace root write test: OK"
            else
              echo "workspace root write test: FAILED (container recovery fallback will be used)"
            fi
            mkdir -p /home/builder/termux-packages/output
            if touch /home/builder/termux-packages/output/.nuxdroid-write-test; then
              rm -f /home/builder/termux-packages/output/.nuxdroid-write-test
              echo "output write test: OK"
            else
              echo "output write test: FAILED" >&2
              exit 1
            fi
          '
          df -h
          sudo docker exec termux-package-builder df -h /home/builder

      - name: Verify custom build environment
        working-directory: termux-packages
        run: |
          sudo docker exec termux-package-builder bash -lc '
            set -e
            cd /home/builder/termux-packages
            . scripts/properties.sh >/dev/null
            test "$TERMUX_APP__PACKAGE_NAME" = "com.nuxdroid"
            test "$TERMUX_APP_PACKAGE" = "com.nuxdroid"
            test "$TERMUX_PREFIX" = "/data/data/com.nuxdroid/files/usr"
            test "$TERMUX_BASE_DIR" = "/data/data/com.nuxdroid/files"
            test "$TERMUX_CACHE_DIR" = "/data/data/com.nuxdroid/cache"
            test "$TERMUX_ANDROID_HOME" = "/data/data/com.nuxdroid/files/home"
            echo "custom build environment: OK"
            env | grep -E "^TERMUX_(APP|BASE|CACHE|PREFIX|ANDROID)" | sort
          '

      - name: Build bootstrap
        working-directory: termux-packages
        run: |
          set +e
          # -f is required after changing TERMUX_APP__PACKAGE_NAME. Without it
          # termux-tools can be reused from the builder cache with the default
          # com.termux prefix even though the binaries themselves are built
          # for com.nuxdroid. That makes `pkg` source a non-existent helper.
          # termux-am/termux-am-socket are also rebuilt so their socket paths
          # and app-package references use com.nuxdroid.
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh \
            -f --architectures aarch64 \
            --add termux-am,termux-am-socket
          build_rc=$?
          set -e
          if [ ! -s bootstrap-aarch64.zip ]; then
            echo "Bootstrap zip missing on host; recovering from container..."
            sudo docker cp termux-package-builder:/home/builder/bootstrap-aarch64.zip ./bootstrap-aarch64.zip
            sudo chown "$(id -u):$(id -g)" ./bootstrap-aarch64.zip
          fi
          if [ "$build_rc" -ne 0 ]; then
            echo "Bootstrap build exited with code $build_rc" >&2
            exit "$build_rc"
          fi
          df -h

      - name: Prune build-only bootstrap packages
        working-directory: termux-packages
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/prune-bootstrap.py" \
            bootstrap-aarch64.zip bootstrap-aarch64.pruned.zip
          mv bootstrap-aarch64.pruned.zip bootstrap-aarch64.zip
          df -h

      - name: Verify bootstrap prefix isolation
        working-directory: termux-packages
        run: |
          set -euo pipefail
          rm -rf bootstrap-prefix-check
          mkdir -p bootstrap-prefix-check
          unzip -q bootstrap-aarch64.zip -d bootstrap-prefix-check

          # No file installed into the NuxDroid prefix may reference the
          # official Termux prefix. This catches stale packages reused from
          # the builder cache, especially termux-tools scripts such as `pkg`.
          leaks="$(grep -rIl --binary-files=without-match \
            '/data/data/com.termux' \
            bootstrap-prefix-check/bin \
            bootstrap-prefix-check/etc \
            bootstrap-prefix-check/libexec \
            bootstrap-prefix-check/var/lib/dpkg/info 2>/dev/null || true)"
          if [ -n "$leaks" ]; then
            echo "::error::Bootstrap files still reference the com.termux prefix:"
            echo "$leaks"
            exit 1
          fi

          # These files are generated from termux-tools and must use the
          # custom app package, not just the custom filesystem prefix.
          for entry in \
            bin/pkg \
            bin/termux-info \
            bin/termux-setup-storage \
            bin/termux-reset; do
            if ! grep -q 'com\.nuxdroid' "bootstrap-prefix-check/$entry"; then
              echo "::error::$entry does not contain the com.nuxdroid package name"
              exit 1
            fi
          done

          for entry in \
            bin/termux-open \
            bin/termux-reset \
            bin/termux-wake-lock \
            bin/termux-wake-unlock; do
            if ! grep -q 'com\.nuxdroid/com\.termux\.app\.' \
              "bootstrap-prefix-check/$entry"; then
              echo "::error::$entry does not keep component classes in com.termux"
              exit 1
            fi
          done

          for entry in bin/termux-reload-settings bin/termux-setup-storage; do
            if ! grep -q 'com\.nuxdroid\.app\.reload_style' \
              "bootstrap-prefix-check/$entry"; then
              echo "::error::$entry does not use the NuxDroid reload action"
              exit 1
            fi
          done

          if grep -rIq --binary-files=without-match \
            'com\.termux/com\.termux\.app\.|com\.termux\.app\.reload_style' \
            bootstrap-prefix-check/bin bootstrap-prefix-check/etc; then
            echo "::error::Bootstrap still contains old app component/action names"
            exit 1
          fi

          echo "Bootstrap prefix isolation verification passed."
          rm -rf bootstrap-prefix-check

      - name: Verify bootstrap
        working-directory: termux-packages
        run: |
          set -euo pipefail
          test -s bootstrap-aarch64.zip
          sha256sum bootstrap-aarch64.zip
          unzip -t bootstrap-aarch64.zip > /tmp/bootstrap-test.log
          unzip -p bootstrap-aarch64.zip var/lib/dpkg/status > /tmp/bootstrap-status.txt
          package_count="$(grep -c '^Package:' /tmp/bootstrap-status.txt)"
          echo "Bootstrap package count: $package_count"
          test "$package_count" -ge 60
          test "$package_count" -le 120
          for package in apt bash dpkg termux-tools termux-exec termux-keyring termux-licenses curl openssl; do
            count="$(grep -c "^Package: ${package}$" /tmp/bootstrap-status.txt || true)"
            if [ "$count" -ne 1 ]; then
              echo "missing or duplicate package: $package" >&2
              exit 1
            fi
          done
          for package in perl python doxygen docbook-xsl tor unbound libx11; do
            if grep -q "^Package: ${package}$" /tmp/bootstrap-status.txt; then
              echo "build-only package was not pruned: $package" >&2
              exit 1
            fi
          done
          unzip -l bootstrap-aarch64.zip > /tmp/bootstrap-entries.txt
          grep -q 'SYMLINKS.txt' /tmp/bootstrap-entries.txt
          echo "Bootstrap verification passed."
          head -20 /tmp/bootstrap-entries.txt

      - name: Upload bootstrap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuxdroid-bootstrap-aarch64
          path: termux-packages/bootstrap-aarch64.zip
          if-no-files-found: error
          retention-days: 7

  apk:
    name: Build installable APK
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout NuxDroid
        uses: actions/checkout@v4

      # NOTE: Bootstrap is NOT embedded in the APK anymore.
      # The app downloads it on first launch from:
      # https://github.com/mrzgamingv20-cyber/nuxdroid-bootstrap
      # This reduces APK size from ~36MB to ~10MB.

      - name: Set bootstrap download URL
        run: |
          echo "BOOTSTRAP_URL=https://github.com/mrzgamingv20-cyber/nuxdroid-bootstrap/releases/latest/download/bootstrap-aarch64.zip" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_SHA256_URL=https://github.com/mrzgamingv20-cyber/nuxdroid-bootstrap/releases/latest/download/SHA256SUMS" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Build APK
        env:
          TERMUX_APP_VERSION_NAME: 0.1.0
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Package artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*arm64-v8a*.apk dist/nuxdroid-debug-arm64-v8a.apk
          cd dist
          sha256sum nuxdroid-debug-arm64-v8a.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nuxdroid-debug-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 7
