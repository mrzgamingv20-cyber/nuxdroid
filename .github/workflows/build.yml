name: Build NuxDroid

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  TERMUX_PACKAGES_COMMIT: 824221abf741a02ac50dc8ce161b52604b3e1a58
  TERMUX_APP__PACKAGE_NAME: com.nuxdroid

jobs:
  # Fast feedback: compile the APK with the upstream bootstrap. This APK is
  # compile-smoke only and must not be installed because its bootstrap prefix
  # is still /data/data/com.termux.
  smoke-apk:
    name: Compile smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout NuxDroid
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Build smoke APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: nuxdroid-compile-smoke-do-not-install
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1

  bootstrap:
    name: Build custom bootstrap (com.nuxdroid)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Termux packages
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: ${{ env.TERMUX_PACKAGES_COMMIT }}
          path: termux-packages
          fetch-depth: 1

      - name: Configure custom prefix
        working-directory: termux-packages
        run: |
          sed -i \
            "s/^TERMUX_APP__PACKAGE_NAME=\"com.termux\"/TERMUX_APP__PACKAGE_NAME=\"${TERMUX_APP__PACKAGE_NAME}\"/" \
            scripts/properties.sh
          grep -n '^TERMUX_APP__PACKAGE_NAME=' scripts/properties.sh
          grep -n '^TERMUX_APP__DATA_DIR=' scripts/properties.sh

      - name: Build bootstrap
        working-directory: termux-packages
        run: |
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64

      - name: Verify bootstrap
        working-directory: termux-packages
        run: |
          test -s bootstrap-aarch64.zip
          sha256sum bootstrap-aarch64.zip
          unzip -l bootstrap-aarch64.zip | head -20

      - name: Upload bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: nuxdroid-bootstrap-aarch64
          path: termux-packages/bootstrap-aarch64.zip
          if-no-files-found: error
          retention-days: 7

  apk:
    name: Build installable APK
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout NuxDroid
        uses: actions/checkout@v4

      - name: Download custom bootstrap
        uses: actions/download-artifact@v4
        with:
          name: nuxdroid-bootstrap-aarch64
          path: app/src/main/cpp

      - name: Verify custom bootstrap
        run: |
          test -s app/src/main/cpp/bootstrap-aarch64.zip
          sha256sum app/src/main/cpp/bootstrap-aarch64.zip
          echo "TERMUX_BOOTSTRAP_SHA256=$(sha256sum app/src/main/cpp/bootstrap-aarch64.zip | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Build APK
        env:
          TERMUX_APP_VERSION_NAME: 0.1.0
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Package artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*arm64-v8a*.apk dist/nuxdroid-debug-arm64-v8a.apk
          cd dist
          sha256sum nuxdroid-debug-arm64-v8a.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nuxdroid-debug-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 7
